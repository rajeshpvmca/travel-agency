<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Adventure | Stackly</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-wrapper">

    <!-- ===== 404 CONTENT ===== -->
    <section class="error-section min-vh-100 d-flex align-items-center justify-content-center bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 text-center">
                    <div class="error-card p-5 shadow-lg">
                        <div class="error-visual mb-4">
                            <h1 class="error-404">404</h1>
                            <div class="floating-compass">
                                <i class="fas fa-compass"></i>
                            </div>
                        </div>
                        
                        <h2 class="display-5 fw-bold text-dark-blue mb-3">Lost Your Way?</h2>
                        <p class="lead text-muted mb-5">
                            The page you’re looking for isn’t here. Let's get you back on track.
                        </p>
                        
                        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                            <button onclick="history.back()" class="btn btn-outline-dark btn-lg px-5 rounded-pill transition-base">
                                <i class="fas fa-arrow-left me-2"></i> Go Back
                            </button>
                            <a href="index.html" class="btn btn-warning btn-lg px-5 rounded-pill shadow-sm transition-base">
                                <i class="fas fa-home me-2"></i> Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
